<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售一对一提醒工具</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {box-sizing: border-box;font-family: system-ui, sans-serif;}
    body {padding:20px;max-width:1200px;margin:0 auto;background:#f7f8fa;}
    .card {background:#fff;padding:20px;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 4px #00000012;}
    .row {display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0;}
    button {padding:8px 14px;cursor:pointer;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:14px;}
    button.secondary {background:#6b7280;}
    textarea, select {padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
    #preview-wrap {border:1px solid #eee;padding:16px;border-radius:8px;background:#fff;}
    .user-item {padding:6px 0;border-bottom:1px solid #f1f1f1;}
    .template-area {width:100%;height:120px;}
    .result-text {width:100%;height:180px;}
  </style>
</head>
<body>
  <div class="card">
    <h3>1. 上传用户CSV/Excel文件</h3>
    <p>表格字段建议：销售老师姓名、学员姓名、学员电话、跟进阶段、备注</p>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>

  <div class="card">
    <h3>2. 选择销售老师</h3>
    <div class="row">
      <select id="sellerSelect">
        <option value="">请先上传文件</option>
      </select>
      <button id="filterBtn">筛选该老师学员</button>
    </div>
  </div>

  <div class="card">
    <h3>3. 学员列表预览（可转图片）</h3>
    <div id="preview-wrap">
      <div id="previewList">暂无数据</div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="copyImgBtn">复制列表为图片</button>
    </div>
  </div>

  <div class="card">
    <h3>4. 话术模板设置</h3>
    <p>变量：{{teacherName}} 老师名字，{{userCount}} 未出单学员数量</p>
    <textarea class="template-area" id="templateInput">@{{teacherName}} 老师，本月一对一提醒：
你名下还有 {{userCount}} 位学员暂未出单，请优先触达跟进。
学员清单见图片，请尽快联系，有问题随时沟通。</textarea>
    <div class="row">
      <button id="genTextBtn">生成话术</button>
      <button class="secondary" id="copyTextBtn">复制话术</button>
    </div>
    <textarea class="result-text" id="resultText" readonly></textarea>
  </div>

<script>
let rawData = [];
let sellerList = [];
let currentSeller = "";
let currentUserList = [];

// 读取Excel/CSV
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    rawData = XLSX.utils.sheet_to_json(firstSheet);
    // 提取销售老师去重列表
    sellerList = [...new Set(rawData.map(item=>item["销售老师姓名"]).filter(Boolean))];
    const sel = document.getElementById('sellerSelect');
    sel.innerHTML = `<option value="">--选择老师--</option>`;
    sellerList.forEach(name=>{
      sel.innerHTML += `<option value="${name}">${name}</option>`;
    })
    alert(`读取成功，共${rawData.length}条学员数据，${sellerList.length}位销售老师`);
  }
  reader.readAsArrayBuffer(file);
})

// 筛选老师学员
document.getElementById('filterBtn').onclick = function(){
  currentSeller = document.getElementById('sellerSelect').value;
  if(!currentSeller) return alert("请选择销售老师");
  currentUserList = rawData.filter(item=> item["销售老师姓名"] === currentSeller);
  const wrap = document.getElementById('previewList');
  let html = `<p><b>${currentSeller}，未出单学员：${currentUserList.length}人</b></p>`;
  currentUserList.forEach(u=>{
    html += `<div class="user-item">学员：${u["学员姓名"]||""}｜电话：${u["学员电话"]||""}｜阶段：${u["跟进阶段"]||""}｜备注：${u["备注"]||""}</div>`
  })
  wrap.innerHTML = html;
}

// 复制预览区域为图片
document.getElementById('copyImgBtn').onclick = async function(){
  const dom = document.getElementById('preview-wrap');
  const canvas = await html2canvas(dom, {scale:2});
  canvas.toBlob(async blob=>{
    const item = new ClipboardItem({ "image/png": blob });
    await navigator.clipboard.write([item]);
    alert("图片已复制！可以直接粘贴到微信/飞书");
  })
}

// 生成话术
document.getElementById('genTextBtn').onclick = function(){
  const tpl = document.getElementById('templateInput').value;
  const count = currentUserList.length;
  let text = tpl.replaceAll("{{teacherName}}", currentSeller).replaceAll("{{userCount}}", count);
  document.getElementById('resultText').value = text;
}
// 复制话术
document.getElementById('copyTextBtn').onclick = function(){
  const txt = document.getElementById('resultText');
  txt.select();
  navigator.clipboard.writeText(txt.value);
  alert("话术已复制");
}
</script>
</body>
</html>
