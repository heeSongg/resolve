<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字测速</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{padding:30px;max-width:900px;margin:0 auto;background:#f5f7fa}
.box{background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px #00000015}
h2{text-align:center;margin-bottom:20px;color:#222}
#sourceText{
  font-size:20px;
  line-height:1.6;
  padding:16px;
  background:#f8fafc;
  border-radius:8px;
  margin-bottom:16px;
}
.correct{color:#10b981}
.wrong{color:#ef4444;background:#fee2e2}
textarea{
  width:100%;
  min-height:140px;
  padding:12px;
  font-size:18px;
  border:1px solid #cbd5e0;
  border-radius:8px;
  resize:none;
}
.info-row{display:flex;gap:20px;margin:12px 0;font-size:16px}
button{padding:10px 18px;border:none;border-radius:6px;background:#3b82f6;color:white;font-size:15px;cursor:pointer}
button:hover{background:#2563eb}
</style>
</head>
<body>
<div class="box">
<h2>⌨️ 打字测速</h2>
<div id="sourceText"></div>
<textarea id="inputArea" placeholder="在这里开始打字..." autocomplete="off"></textarea>
<div class="info-row">
  <div>用时：<span id="time">0</span> s</div>
  <div>速度：<span id="wpm">0</span> 字/分钟</div>
  <div>正确率：<span id="accuracy">0</span> %</div>
</div>
<button onclick="restart()">重新开始</button>
</div>

<script>
// 测试文本库
const textList = [
  "静态网页托管在GitHub Pages，不需要后端服务器，纯前端代码就能运行。",
  "前端工具箱可以帮我们快速格式化JSON，转换时间戳，批量处理文本，提升日常工作效率。",
  "写代码的时候要注意命名规范，做好注释，方便自己和其他人后续维护项目。"
];

let sourceText = "";
let startTime = null;
let timer = null;
let finished = false;

// 随机选取文本
function pickText(){
  const idx = Math.floor(Math.random() * textList.length);
  sourceText = textList[idx];
  document.getElementById('sourceText').innerHTML = sourceText.split('').map(c=>`<span>${c}</span>`).join('');
}

function restart(){
  clearInterval(timer);
  startTime = null;
  finished = false;
  document.getElementById('inputArea').value = "";
  document.getElementById('time').textContent = "0";
  document.getElementById('wpm').textContent = "0";
  document.getElementById('accuracy').textContent = "0";
  pickText();
}

document.getElementById('inputArea').addEventListener('input', function(e){
  if(finished) return;
  const inputStr = e.target.value;
  // 首次输入启动计时
  if(startTime === null){
    startTime = Date.now();
    timer = setInterval(updateInfo, 200);
  }
  // 逐字符对比染色
  const spans = document.querySelectorAll("#sourceText span");
  let correctCount = 0;
  for(let i=0;i<spans.length;i++){
    if(i < inputStr.length){
      if(inputStr[i] === sourceText[i]){
        spans[i].className = "correct";
        correctCount++;
      }else{
        spans[i].className = "wrong";
      }
    }else{
      spans[i].className = "";
    }
  }
  // 全部打完
  if(inputStr.length >= sourceText.length){
    finished = true;
    clearInterval(timer);
  }
  updateInfo();
})

function updateInfo(){
  const inputStr = document.getElementById('inputArea').value;
  const usedSec = (Date.now() - startTime)/1000;
  const correctCount = Array.from(document.querySelectorAll("#sourceText span.correct")).length;
  const totalLen = sourceText.length;
  const acc = totalLen ===0 ? 0 : Math.round(correctCount / totalLen *100);
  const wpm = usedSec ===0 ? 0 : Math.round(correctCount / usedSec *60);

  document.getElementById('time').textContent = Math.round(usedSec);
  document.getElementById('wpm').textContent = wpm;
  document.getElementById('accuracy').textContent = acc;
}

restart();
</script>
</body>
</html>
