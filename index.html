<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背单词小工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{padding:30px;max-width:700px;margin:0 auto;background:#f5f7fa}
h2{text-align:center;margin-bottom:24px;color:#222}
.card-wrap{perspective:1000px;margin-bottom:24px}
#card{
  width:100%;
  height:260px;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 0.5s;
  cursor:pointer;
}
#card.flipped{transform: rotateY(180deg)}
.card-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;padding:24px;font-size:28px;text-align:center;
  box-shadow:0 2px 10px #00000018;
}
.front{background:#ffffff;color:#2563eb;}
.back{background:#2563eb;color:#fff;transform:rotateY(180deg)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{padding:10px 18px;border:none;border-radius:6px;background:#3b82f6;color:white;font-size:15px;cursor:pointer}
button:hover{background:#2563eb}
button.good{background:#10b981}
button.reset{background:#ef4444}
.info{text-align:center;margin:16px 0;font-size:16px;color:#475569}
</style>
</head>
<body>
<h2>📖 单词卡片</h2>
<div class="info">进度：<span id="progress">0/0</span></div>
<div class="card-wrap">
  <div id="card" onclick="flipCard()">
    <div class="card-face front" id="wordFront"></div>
    <div class="card-face back" id="wordBack"></div>
  </div>
</div>
<div class="btns">
  <button onclick="prevWord()">上一个</button>
  <button onclick="nextWord()">下一个</button>
  <button class="good" onclick="markMastered()">标记已掌握</button>
  <button class="reset" onclick="resetAll()">重置学习记录</button>
</div>

<script>
// ========== 在这里修改你的单词库 ==========
const wordList = [
  {en:"mathematician",cn:"n.数学家"},
  {en:"mathematization",cn:"n.数学化"},
  {en:"algorithm",cn:"n.算法"},
  {en:"variable",cn:"n.变量"},
  {en:"function",cn:"n.函数；功能"},
  {en:"static",cn:"adj.静态的"},
  {en:"deploy",cn:"v.部署"},
  {en:"repository",cn:"n.仓库"},
  {en:"accessibility",cn:"n.可访问性，无障碍"},
  {en:"compact",cn:"adj.紧凑的；简洁的"}
];
// ===========================================

let mastered = JSON.parse(localStorage.getItem('wordMastered')) || [];
let currentIndex = 0;
let isFlipped = false;

// 获取未掌握单词列表
function getStudyList(){
  return wordList.filter((_,idx)=>!mastered.includes(idx));
}

function render(){
  const list = getStudyList();
  document.getElementById('progress').textContent = `${currentIndex+1}/${list.length}`;
  if(list.length ===0){
    document.getElementById('wordFront').textContent = "🎉 全部单词已掌握";
    document.getElementById('wordBack').textContent = "点击重置继续学习";
    return;
  }
  const word = list[currentIndex];
  document.getElementById('wordFront').textContent = word.en;
  document.getElementById('wordBack').textContent = word.cn;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
}

function flipCard(){
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped');
}

function nextWord(){
  const list = getStudyList();
  if(currentIndex < list.length -1) currentIndex++;
  else currentIndex = 0;
  render();
}

function prevWord(){
  const list = getStudyList();
  if(currentIndex > 0) currentIndex--;
  else currentIndex = list.length -1;
  render();
}

function markMastered(){
  const list = getStudyList();
  if(list.length ===0) return;
  const wordOriginIndex = wordList.indexOf(list[currentIndex]);
  if(!mastered.includes(wordOriginIndex)){
    mastered.push(wordOriginIndex);
    localStorage.setItem('wordMastered', JSON.stringify(mastered));
  }
  nextWord();
}

function resetAll(){
  mastered = [];
  localStorage.removeItem('wordMastered');
  currentIndex =0;
  render();
}

render();
</script>
</body>
</html>
