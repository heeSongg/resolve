<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜数字小游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{padding:30px;max-width:600px;margin:30px auto;background:#f5f7fa;text-align:center}
h2{color:#222;margin-bottom:20px}
.box{background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px #00000015}
input{padding:10px;width:200px;font-size:16px;border:1px solid #cbd5e0;border-radius:6px;margin:10px 0}
button{padding:10px 18px;margin:6px;border:none;border-radius:6px;background:#3b82f6;color:white;font-size:15px;cursor:pointer}
button:hover{background:#2563eb}
#msg{font-size:18px;margin:16px 0;color:#333}
</style>
</head>
<body>
<div class="box">
<h2>🎮 猜数字游戏</h2>
<p>我已经想好一个 1 ~ 100 之间的数字，你来猜猜看！</p>
<input type="number" id="guessInput" placeholder="输入数字" min="1" max="100">
<br>
<button onclick="checkGuess()">提交猜测</button>
<button onclick="restartGame()">重新开始</button>
<div id="msg"></div>
</div>

<script>
let secretNum;
let count;

// 初始化游戏
function initGame(){
  secretNum = Math.floor(Math.random() * 100) + 1;
  count = 0;
  document.getElementById('msg').textContent = "";
  document.getElementById('guessInput').value = "";
}

function checkGuess(){
  const val = document.getElementById('guessInput').value.trim();
  const num = Number(val);
  const msgDom = document.getElementById('msg');
  if(isNaN(num) || num <1 || num>100){
    msgDom.textContent = "请输入 1 ~ 100 的有效数字";
    msgDom.style.color = "red";
    return;
  }
  count++;
  if(num > secretNum){
    msgDom.textContent = `猜大了！已猜 ${count} 次`;
    msgDom.style.color = "#f59e0b";
  }else if(num < secretNum){
    msgDom.textContent = `猜小了！已猜 ${count} 次`;
    msgDom.style.color = "#f59e0b";
  }else{
    msgDom.textContent = `🎉恭喜猜对！答案就是 ${secretNum}，一共猜了 ${count} 次`;
    msgDom.style.color = "#10b981";
  }
}

function restartGame(){
  initGame();
}

initGame();
</script>
</body>
</html>
